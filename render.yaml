services:
  - type: web
    name: puribunga2-web
    env: docker
    plan: free # or 'starter' if you need more resources
    region: singapore # Adjust based on your preference
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
